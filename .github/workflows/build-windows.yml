name: Windows-Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Versions-Tag für ein Release, z. B. v1.0.0 (leer = nur bauen)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Krypto-Testvektoren
        run: npm test

      - name: Installer und portable EXE bauen
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: SHA-256-Prüfsummen
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: KryptoQuest-Windows
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Release anlegen (bei Tags v* oder manuell mit release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: KryptoQuest ${{ inputs.release_tag || github.ref_name }}
          body_path: docs/release-notes/${{ inputs.release_tag || github.ref_name }}.md
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
